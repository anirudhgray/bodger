# bodger's self-hosted stack: one service, no separate database container
# (SQLite is an embedded file, ADR-0007) and no reverse proxy (the binary
# serves the API and the embedded web UI itself, ADR-0001).
#
# No `ports:` mapping yet, deliberately - see "Running with Docker" in
# docs/user-guide.md. Short version: bodger refuses to bind anything but
# loopback until authentication exists (ADR-0006), and a loopback bind
# inside a container's own network namespace is never reachable through
# Docker's bridge-network port publishing - a `ports:` entry here would
# silently do nothing. `network_mode: host` would work around that, but
# trades away container network isolation to do it, which isn't a call
# to make silently in a compose file most people won't read closely.
# Pinned here until #56 (auth) lands and a non-loopback bind is allowed,
# at which point this gets a real `ports:` mapping instead.
services:
  bodger:
    build:
      context: .
    image: bodger:latest
    restart: unless-stopped
    environment:
      # Uncomment to set your own defaults (see docs/user-guide.md):
      # BODGER_DEFAULT_CURRENCY: USD
      # BODGER_USER_TIMEZONE: UTC
      BODGER_DB_PATH: /data/bodger.db
    volumes:
      # Named volume, not a bind mount: survives `docker compose down` and
      # a container recreate (e.g. `docker compose pull && docker compose
      # up -d` to upgrade, ADR-0007). Back it up the same way as any other
      # bodger install - copy bodger.db back out - see docs/user-guide.md.
      - bodger-data:/data

volumes:
  bodger-data:
