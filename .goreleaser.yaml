# GoReleaser config — see docs/releasing.md for the release procedure this
# drives, and docs/contributing.md for the semver policy it assumes.
#
# Local dry run (no publish, no tag required): `goreleaser release --snapshot --clean --skip=publish`
version: 2

project_name: bodger

before:
  hooks:
    - go mod tidy

builds:
  - id: bodger
    main: ./cmd/bodger
    binary: bodger
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Mirrors the reproducibility intent of `make build` (see Makefile),
    # plus build metadata for internal/platform/version.
    ldflags:
      - -s -w
      - -X github.com/anirudhgray/bodger/internal/platform/version.Version={{.Version}}
      - -X github.com/anirudhgray/bodger/internal/platform/version.Commit={{.ShortCommit}}
      - -X github.com/anirudhgray/bodger/internal/platform/version.Date={{.Date}}

archives:
  - id: bodger
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# Read from the same conventional-commit history the squash-merge PR
# titles already enforce (CLAUDE.md) — no separate changelog tool. The
# checked-in CHANGELOG.md is generated with this exact config, in
# changelog-only/snapshot mode, so the file and the eventual GitHub
# release notes are never two independently-maintained texts. See
# docs/releasing.md.
#
# Group titles are Keep a Changelog's categories, not conventional
# commits' own type names — feat -> Added, fix -> Fixed, refactor/perf ->
# Changed. Deprecated and Removed have no reliable commit-type mapping
# (a fix or a feat can just as easily do either), so they're not
# auto-populated — add them by hand in the routine release PR when one
# applies. Internal-only commit types (docs, chore, test, ci, style,
# build) are filtered out entirely rather than dumped in a catch-all
# group: Keep a Changelog is for notable changes, and none of those
# affect what a user of the released binary experiences.
#
# format's author fallback: .AuthorUsername only resolves via the GitHub
# API (requires "use: github" AND a previous tag to diff against — the
# very first release always falls back to git-only mode, and thereafter
# it depends on GitHub API reachability), so relying on it alone would
# render "(@)" for entries where the API never got consulted. .AuthorName
# comes straight from git and is always populated, so it's the fallback.
#
# .SHA is linked to its commit; the "(#N)" PR reference embedded in
# .Message (GitHub's own squash-merge suffix) is deliberately left
# untouched — GoReleaser's changelog format template has no Sprig
# funcmap (regexReplaceAll and friends aren't defined here, confirmed by
# actually hitting "function \"regexReplaceAll\" not defined" trying it),
# so there's no way to turn embedded message text into a link from this
# field alone.
changelog:
  sort: asc
  use: github
  abbrev: 8
  format: "[{{ .SHA }}](https://github.com/anirudhgray/bodger/commit/{{ .SHA }}): {{ .Message }} ({{ if .AuthorUsername }}@{{ .AuthorUsername }}{{ else }}{{ .AuthorName }}{{ end }})"
  groups:
    - title: "Added"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Changed"
      regexp: '^.*?(refactor|perf)(\(.+\))??!?:.+$'
      order: 1
    - title: "Fixed"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: "Security"
      regexp: '^.*?\(security\)!?:.+$'
      order: 3
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
      - '^.*?docs(\(.+\))??!?:.+$'
      - '^.*?chore(\(.+\))??!?:.+$'
      - '^.*?test(\(.+\))??!?:.+$'
      - '^.*?ci(\(.+\))??!?:.+$'
      - '^.*?style(\(.+\))??!?:.+$'
      - '^.*?build(\(.+\))??!?:.+$'

# The release title defaults to the bare tag. For a milestone-completing
# release, release.yaml reads the annotated tag's own message (set with
# `git tag -a vX.Y.Z -m "M<n> <Name>"`, per docs/releasing.md) and exports
# it as RELEASE_TITLE before invoking GoReleaser — the milestone name
# travels with the tag object itself rather than needing a separate input
# at release time. header does the same for freeform release-note content:
# an optional second paragraph in the same tag message (RELEASE_NOTES_HEADER,
# also exported by release.yaml) is prepended above the generated
# changelog. Both are empty-safe — GoReleaser renders an empty template to
# nothing, not an error. footer always renders, unconditionally: a link
# back to the full CHANGELOG.md, since a single release's notes are only
# ever a slice of it.
release:
  name_template: >-
    {{ if .Env.RELEASE_TITLE }}{{ .Env.RELEASE_TITLE }}{{ else }}{{ .Tag }}{{ end }}
  header: '{{ .Env.RELEASE_NOTES_HEADER }}'
  footer: >-
    ---


    Full history: [`CHANGELOG.md`](https://github.com/anirudhgray/bodger/blob/main/CHANGELOG.md)
